# Copy frontend/dist into /usr/share/nginx/html/admin before starting Nginx.
# Replace 127.0.0.1:8080 when Spring Boot is on another host/container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64m;

    location = / { return 302 /admin/; }
    location = /admin { return 308 /admin/; }
    location = /admin/index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /admin/docs/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /admin/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }
    location ~ ^/api/v1/service/knowledge-bases/[1-9][0-9]*/answer/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
